name: Trading bot tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run trading bot unit tests
        run: python -m unittest discover -s tests -v
      - name: Check bot CLI
        run: python trading_bot.py --help
      - name: Download official Kraken quarterly historical candles
        run: |
          curl -fL --retry 3 -o kraken_2026Q2.zip https://assets.kraken.com/marketing/institutions/Kraken_OHLCVT_2026Q2.zip
          curl -fL --retry 3 -o kraken_2026Q3.zip https://assets.kraken.com/marketing/institutions/Kraken_OHLCVT_2026Q3.zip
      - name: Prepare multi-month XBTUSDT 5-minute dataset
        run: |
          python - <<'PY'
          import csv, io, zipfile
          from pathlib import Path
          archives = ['kraken_2026Q2.zip', 'kraken_2026Q3.zip']
          rows = {}
          matched = []
          for archive in archives:
              with zipfile.ZipFile(archive) as zf:
                  names = [n for n in zf.namelist() if Path(n).name.upper() == 'XBTUSDT_5.CSV']
                  if not names:
                      raise SystemExit(f'XBTUSDT_5.csv not found in {archive}; sample files: {zf.namelist()[:20]}')
                  for name in names:
                      matched.append((archive, name))
                      with zf.open(name) as raw:
                          for line in io.TextIOWrapper(raw, encoding='utf-8-sig'):
                              parts = line.strip().split(',')
                              if len(parts) < 6:
                                  continue
                              try:
                                  timestamp = int(float(parts[0]))
                                  values = [float(parts[i]) for i in range(1, 6)]
                                  if timestamp > 0 and all(v > 0 for v in values[:4]):
                                      rows[timestamp] = [timestamp, *values[:5]]
                              except (ValueError, IndexError):
                                  continue
          ordered = [rows[t] for t in sorted(rows)]
          if len(ordered) < 1000:
              raise SystemExit(f'Not enough historical candles: {len(ordered)}')
          with open('kraken_multi_month.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.writer(f)
              writer.writerow(['time','open','high','low','close','volume'])
              writer.writerows([[r[0],r[1],r[2],r[3],r[4],r[5]] for r in ordered])
          print(f'Prepared {len(ordered)} XBTUSDT 5-minute candles from {ordered[0][0]} to {ordered[-1][0]} UTC.')
          print('Source files: ' + ', '.join(f'{a}:{n}' for a,n in matched))
          PY
      - name: Run multi-month historical backtest (paper only)
        run: python trading_bot.py BACKTEST --csv kraken_multi_month.csv --balance 1000 --fee 0.008 --slippage 0
