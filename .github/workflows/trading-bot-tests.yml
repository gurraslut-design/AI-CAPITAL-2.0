name: Trading bot tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only machine-learning dependency
        run: python -m pip install scikit-learn
      - name: Run trading bot unit tests
        run: python -m unittest discover -s tests -v
      - name: Check bot CLI
        run: python trading_bot.py --help
      - name: Download official Kraken quarterly historical candles
        run: |
          curl -fL --retry 3 -o kraken_2026Q2.zip https://assets.kraken.com/marketing/institutions/Kraken_OHLCVT_2026Q2.zip
          curl -fL --retry 3 -o kraken_2026Q3.zip https://assets.kraken.com/marketing/institutions/Kraken_OHLCVT_2026Q3.zip
      - name: Prepare multi-month XBTUSDT 5-minute dataset
        run: |
          python - <<'PY'
          import csv, io, zipfile
          from pathlib import Path
          archives = ['kraken_2026Q2.zip', 'kraken_2026Q3.zip']
          rows = {}
          matched = []
          for archive in archives:
              with zipfile.ZipFile(archive) as zf:
                  names = [n for n in zf.namelist() if Path(n).name.upper() == 'XBTUSDT_5.CSV']
                  if not names:
                      raise SystemExit(f'XBTUSDT_5.csv not found in {archive}; sample files: {zf.namelist()[:20]}')
                  for name in names:
                      matched.append((archive, name))
                      with zf.open(name) as raw:
                          for line in io.TextIOWrapper(raw, encoding='utf-8-sig'):
                              parts = line.strip().split(',')
                              if len(parts) < 6:
                                  continue
                              try:
                                  timestamp = int(float(parts[0]))
                                  values = [float(parts[i]) for i in range(1, 6)]
                                  if timestamp > 0 and all(v > 0 for v in values[:4]):
                                      rows[timestamp] = [timestamp, *values[:5]]
                              except (ValueError, IndexError):
                                  continue
          ordered = [rows[t] for t in sorted(rows)]
          if len(ordered) < 1000:
              raise SystemExit(f'Not enough historical candles: {len(ordered)}')
          with open('kraken_multi_month.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.writer(f)
              writer.writerow(['time','open','high','low','close','volume'])
              writer.writerows([[r[0],r[1],r[2],r[3],r[4],r[5]] for r in ordered])
          print(f'Prepared {len(ordered)} XBTUSDT 5-minute candles from {ordered[0][0]} to {ordered[-1][0]} UTC.')
          print('Source files: ' + ', '.join(f'{a}:{n}' for a,n in matched))
          PY
      - name: Research strategy variants with chronological holdout (paper only)
        run: |
          python - <<'PY'
          import json
          import trading_bot as bot

          base_rows = bot.read_csv('kraken_multi_month.csv')

          def aggregate(rows, group_size):
              out = []
              usable = len(rows) - (len(rows) % group_size)
              for offset in range(0, usable, group_size):
                  chunk = rows[offset:offset + group_size]
                  if len(chunk) != group_size:
                      continue
                  out.append({
                      'time': chunk[-1]['time'],
                      'open': chunk[0]['open'],
                      'high': max(x['high'] for x in chunk),
                      'low': min(x['low'] for x in chunk),
                      'close': chunk[-1]['close'],
                      'volume': sum(x.get('volume', 0.0) for x in chunk),
                  })
              return out

          datasets = {
              '5m': base_rows,
              '15m': aggregate(base_rows, 3),
              '1h': aggregate(base_rows, 12),
          }
          original = (bot.EMA_FAST, bot.EMA_SLOW, bot.STOP_FRACTION, bot.TAKE_PROFIT_FRACTION)
          candidates = []
          research_fee = 0.008  # fee per side; no leverage and no slippage in primary search
          split_data = {}
          try:
              for timeframe, rows in datasets.items():
                  split = int(len(rows) * 0.60)
                  split2 = int(len(rows) * 0.80)
                  train, validation, final_test = rows[:split], rows[split:split2], rows[split2:]
                  split_data[timeframe] = (train, validation, final_test)
                  for entry_mode in ("cross", "pullback", "breakout", "rsi_rebound", "ema_reclaim"):
                      for fast, slow in ((10, 30), (20, 50), (30, 100)):
                          thresholds = (25, 30, 35) if entry_mode == "rsi_rebound" else ((45, 50, 55) if entry_mode == "ema_reclaim" else (50, 55, 60))
                          for rsi_min in thresholds:
                              for trend_period in (0, 100, 200):
                                  for stop_fraction in (0.01, 0.02):
                                      for target_fraction in (0.03, 0.04, 0.06):
                                          bot.EMA_FAST, bot.EMA_SLOW = fast, slow
                                          bot.STOP_FRACTION, bot.TAKE_PROFIT_FRACTION = stop_fraction, target_fraction
                                          report, _ = bot.backtest(
                                              train, 1000.0, research_fee, 0.0,
                                              rsi_threshold=rsi_min, trend_filter_period=trend_period,
                                              entry_mode=entry_mode)
                                          candidates.append({
                                              'timeframe': timeframe,
                                              'entry_mode': entry_mode,
                                              'ema_fast': fast, 'ema_slow': slow, 'rsi_min': rsi_min,
                                              'trend_filter_period': trend_period,
                                              'stop_pct': round(stop_fraction * 100, 2),
                                              'target_pct': round(target_fraction * 100, 2),
                                              'train_return_pct': report['total_return_pct'],
                                              'train_profit_factor': report['profit_factor'],
                                              'train_trades': report['trades'],
                                          })
              # Selection uses training data only across 3 timeframes; validation/test remain unseen.
              best = max(candidates, key=lambda x: x['train_return_pct'])
              train, validation, final_test = split_data[best['timeframe']]
              bot.EMA_FAST, bot.EMA_SLOW = best['ema_fast'], best['ema_slow']
              bot.STOP_FRACTION, bot.TAKE_PROFIT_FRACTION = best['stop_pct'] / 100, best['target_pct'] / 100
              validation_report, _ = bot.backtest(
                  validation, 1000.0, research_fee, 0.0,
                  rsi_threshold=best['rsi_min'], trend_filter_period=best['trend_filter_period'],
                  entry_mode=best['entry_mode'])
              final_report, _ = bot.backtest(
                  final_test, 1000.0, research_fee, 0.0,
                  rsi_threshold=best['rsi_min'], trend_filter_period=best['trend_filter_period'],
                  entry_mode=best['entry_mode'])
              # Stress test the selected setup with 0.1% adverse slippage per side.
              stress_validation, _ = bot.backtest(
                  validation, 1000.0, research_fee, 0.001,
                  rsi_threshold=best['rsi_min'], trend_filter_period=best['trend_filter_period'],
                  entry_mode=best['entry_mode'])
              stress_final, _ = bot.backtest(
                  final_test, 1000.0, research_fee, 0.001,
                  rsi_threshold=best['rsi_min'], trend_filter_period=best['trend_filter_period'],
                  entry_mode=best['entry_mode'])
              bot.EMA_FAST, bot.EMA_SLOW, bot.STOP_FRACTION, bot.TAKE_PROFIT_FRACTION = original
              base_train, base_validation, base_final = split_data['5m']
              baseline_validation, _ = bot.backtest(base_validation, 1000.0, research_fee, 0.0)
              baseline_final, _ = bot.backtest(base_final, 1000.0, research_fee, 0.0)
              gate_passed = (
                  validation_report['total_return_pct'] > 0
                  and final_report['total_return_pct'] > 0
                  and stress_validation['total_return_pct'] > 0
                  and stress_final['total_return_pct'] > 0
                  and validation_report['profit_factor'] not in (None, 'infinity')
                  and final_report['profit_factor'] not in (None, 'infinity')
                  and validation_report['profit_factor'] > 1.0
                  and final_report['profit_factor'] > 1.0
                  and validation_report['trades'] >= 20
                  and final_report['trades'] >= 20
              )
              print(json.dumps({
                  'note': 'Research only; selects among 2430 variants on first 60% of each of 5m/15m/1h datasets; next 20% validates and final 20% is untouched chronological test. Stress test adds 0.1% adverse slippage per side. No live orders.',
                  'candles': {tf: {'total': len(rows), 'train': len(split_data[tf][0]), 'validation': len(split_data[tf][1]), 'final_test': len(split_data[tf][2])} for tf, rows in datasets.items()},
                  'fee_per_side_pct': 0.8,
                  'baseline_5m_holdout': {
                      'validation_return_pct': baseline_validation['total_return_pct'],
                      'validation_trades': baseline_validation['trades'],
                      'validation_profit_factor': baseline_validation['profit_factor'],
                      'final_test_return_pct': baseline_final['total_return_pct'],
                      'final_test_trades': baseline_final['trades'],
                      'final_test_profit_factor': baseline_final['profit_factor'],
                  },
                  'training_candidates': candidates,
                  'selected_on_train_only': best,
                  'selected_candidate_validation': {
                      'return_pct': validation_report['total_return_pct'], 'final_balance': validation_report['final_balance'],
                      'trades': validation_report['trades'], 'profit_factor': validation_report['profit_factor'],
                      'max_drawdown_pct': validation_report['max_drawdown_pct'],
                  },
                  'selected_candidate_final_test': {
                      'return_pct': final_report['total_return_pct'], 'final_balance': final_report['final_balance'],
                      'trades': final_report['trades'], 'profit_factor': final_report['profit_factor'],
                      'max_drawdown_pct': final_report['max_drawdown_pct'],
                  },
                  'stress_test_0_1pct_slippage_per_side': {
                      'validation_return_pct': stress_validation['total_return_pct'],
                      'final_test_return_pct': stress_final['total_return_pct'],
                  },
                  'promotion_gate': {
                      'passed': gate_passed,
                      'rule': 'Validation and untouched final test must both be profitable, PF > 1, at least 20 trades each, and remain profitable with 0.1% adverse slippage per side.',
                      'action_if_failed': 'Keep bot paper-only; continue research rather than selecting the least-bad losing variant.'
                  },
              }, indent=2))
          finally:
              bot.EMA_FAST, bot.EMA_SLOW, bot.STOP_FRACTION, bot.TAKE_PROFIT_FRACTION = original
          PY
      - name: Research cost-aware hourly forecast with walk-forward holdouts (paper only)
        run: python research_cost_aware.py kraken_multi_month.csv
      - name: Research low-frequency technical rules with chronological holdouts (paper only)
        run: python research_low_frequency.py kraken_multi_month.csv
      - name: Research regime-aware strategies against buy-and-hold (paper only)
        run: python research_regime_aware.py kraken_multi_month.csv
      - name: Research daily BTC-or-cash allocation against buy-and-hold (paper only)
        run: python research_btc_cash_allocation.py kraken_multi_month.csv
      - name: Compare fee assumptions on identical historical candles (paper only)
        run: |
          python - <<'PY'
          import json
          import trading_bot
          rows = trading_bot.read_csv('kraken_multi_month.csv')
          results = []
          for fee in (0.008, 0.004, 0.002, 0.001):
              report, _ = trading_bot.backtest(rows, 1000.0, fee, 0.0)
              results.append({
                  'fee_per_side_pct': report['fee_per_side_pct'],
                  'final_balance': report['final_balance'],
                  'return_pct': report['total_return_pct'],
                  'trades': report['trades'],
                  'win_rate_pct': report['win_rate_pct'],
                  'fees_total': report['fees_total'],
                  'max_drawdown_pct': report['max_drawdown_pct'],
                  'profit_factor': report['profit_factor'],
              })
          print(json.dumps({
              'note': 'Sensitivity analysis only; identical strategy and candles, not a parameter optimization or profit guarantee.',
              'results': results,
          }, indent=2))
          PY
