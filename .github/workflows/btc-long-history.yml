name: Long-history BTC strategy research
# Includes hourly ML walk-forward tests; paper research only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc-long-history.yml'
      - 'research_btc_long_history.py'
      - 'research_btc_hourly_ml.py'
permissions:
  contents: read
jobs:
  long-history-research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download and assemble official Kraken full-history archive
        run: |
          set -euo pipefail
          for part in 00 01 02 03 04; do
            curl -fL --retry 3 --connect-timeout 30 -o "kraken_part${part}" "https://assets.kraken.com/marketing/institutions/Kraken_OHLCVT_Full.zip.part${part}"
            cat "kraken_part${part}" >> Kraken_OHLCVT_Full.zip
            rm "kraken_part${part}"
            echo "Downloaded and appended official archive part ${part}"
          done
      - name: Download latest quarterly update
        run: curl -fL --retry 3 -o kraken_2026Q3.zip https://assets.kraken.com/marketing/institutions/Kraken_OHLCVT_2026Q3.zip
      - name: Install ML research dependencies
        run: python -m pip install --upgrade numpy scikit-learn
      - name: Extract BTC daily and hourly candles and merge updates
        run: |
          python - <<'PY'
          import csv, io, zipfile
          from pathlib import Path
          rows = {}
          sources = [
              ("Kraken_OHLCVT_Full.zip", "XBTUSD_1440.csv", "daily"),
              ("kraken_2026Q3.zip", "XBTUSD_1440.csv", "daily"),
              ("Kraken_OHLCVT_Full.zip", "XBTUSD_60.csv", "hourly"),
              ("kraken_2026Q3.zip", "XBTUSD_60.csv", "hourly"),
          ]
          hourly_rows = {}
          for archive, target, timeframe in sources:
              target_rows = rows if timeframe == "daily" else hourly_rows
              with zipfile.ZipFile(archive) as zf:
                  names = [n for n in zf.namelist() if Path(n).name.upper() == target.upper()]
                  if not names:
                      raise SystemExit(f"{target} not found in {archive}")
                  for name in names:
                      with zf.open(name) as raw:
                          for line in io.TextIOWrapper(raw, encoding="utf-8-sig"):
                              p = line.strip().split(",")
                              if len(p) < 5: continue
                              try:
                                  t = int(float(p[0]))
                                  vals = [float(x) for x in (p[1:5] if timeframe == "daily" else p[1:6])]
                                  if t > 0 and min(vals[:4]) > 0 and (timeframe == "daily" or vals[4] >= 0):
                                      target_rows[t] = [t, *vals]
                              except ValueError:
                                  continue
              print(f"Read {archive}: matched {target}")
          ordered = [rows[t] for t in sorted(rows)]
          if len(ordered) < 1000:
              raise SystemExit(f"Not enough daily candles: {len(ordered)}")
          with open("kraken_btc_daily.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerows(ordered)
          print(f"Prepared {len(ordered)} daily BTC/USD candles from {ordered[0][0]} to {ordered[-1][0]}")
          hourly = [hourly_rows[t] for t in sorted(hourly_rows)]
          if len(hourly) < 25000: raise SystemExit(f"Not enough hourly candles: {len(hourly)}")
          with open("kraken_btc_hourly.csv", "w", newline="") as f:
              w = csv.writer(f); w.writerows(hourly)
          print(f"Prepared {len(hourly)} hourly BTC/USD candles from {hourly[0][0]} to {hourly[-1][0]}")
          PY
      - name: Run long-history daily baseline research
        run: python research_btc_long_history.py kraken_btc_daily.csv
      - name: Run cost-aware hourly ML walk-forward research
        run: python research_btc_hourly_ml.py kraken_btc_hourly.csv
